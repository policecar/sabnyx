[project]
name = "sabnyx"
version = "0.0.1"
description = "Personal knowledge vault with three-tier pipeline, ledger, and agent contracts."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pydantic>=2.8",
    "python-frontmatter>=1.1",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.7",
    "anthropic>=0.109.1",
]

[project.optional-dependencies]
# Opt-in semantic retrieval (SABNYX_RETRIEVER=vector). Static embeddings —
# torch-free, ~30MB, CPU. Install with `uv sync --extra vector`.
vector = [
    "model2vec>=0.3",
    "numpy>=1.26",
]

[project.scripts]
sabnyx = "sabnyx.cli:main"

[tool.uv]
dev-dependencies = [
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "pytest>=8.0",
    "numpy>=1.26",  # for the vector-retriever cosine tests (model2vec stubbed)
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PT"]
ignore = ["E501"]  # line-length handled by formatter

[tool.ruff.format]
quote-style = "double"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sabnyx"]
