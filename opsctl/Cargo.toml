[package]
name = "opsctl"
version = "0.1.0"
edition = "2021"
description = "Minimal control plane for the sabnyx ops ledger"

[[bin]]
name = "opsctl"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"
